<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Dapperowl: Specialise for charity">
<meta property="og:description" content="Experts share their knowledge; firms donate 100% to the expert’s chosen charity.">
<meta property="og:url" content="https://dapperowl.netlify.app/firm-dashboard.html">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dapperowl.netlify.app/og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="Specialise for charity: three people talking over coffee at a round table">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dapperowl: Specialise for charity">
<meta name="twitter:description" content="Experts share their knowledge; firms donate 100% to the expert’s chosen charity.">
<meta name="twitter:image" content="https://dapperowl.netlify.app/og-image.png?v=2">
<meta name="twitter:image:alt" content="Specialise for charity: three people talking over coffee at a round table">
<title>My bookings · Dapperowl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
main{max-width:1180px;margin:0 auto;padding-block:48px 90px;display:flex;flex-direction:column;gap:26px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.pay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.ref{font-family:var(--ui);font-weight:700;font-size:26px;letter-spacing:.06em;border:3px dashed var(--ink);border-radius:12px;padding:8px 16px;background:var(--white);display:inline-block}
.upload{border:3px dashed var(--ink);border-radius:14px;padding:16px;background:var(--white);display:flex;flex-direction:column;gap:10px}
.upload input{font-size:17px}
table{width:100%;border-collapse:collapse;font-size:18px}
th,td{text-align:left;padding:12px 10px;border-bottom:2px solid var(--soft);vertical-align:top}
th{font-family:var(--ui);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.tw{overflow-x:auto}
.ok-msg{background:#D6F1E1;border:3px solid var(--ink);border-radius:14px;padding:14px 18px;font-size:18px}
.switch{display:flex;gap:14px;align-items:center;font-size:18px}
.switch input{width:24px;height:24px;accent-color:var(--cobalt)}
.stars{display:flex;gap:6px}
.stars button{font-size:26px;background:none;border:none;cursor:pointer;color:var(--soft);padding:0 2px;-webkit-text-stroke:1.5px var(--ink)}
.stars button.on{color:var(--amber)}
.cq{container-type:inline-size}
.cert{aspect-ratio:4/5;background:#fff;position:relative;overflow:hidden;color:var(--navy)}
.c1 .frame{position:absolute;inset:4.5cqw;border:.5cqw solid var(--navy);outline:.25cqw solid var(--navy);outline-offset:-2.2cqw}
.c1 .in{position:absolute;inset:4.5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2cqw;padding:9cqw 8cqw 11cqw}
.c1 .logo{width:30cqw;height:auto}
.c1 .k{font-family:var(--ui);font-weight:600;font-size:3.2cqw;letter-spacing:.32em;text-transform:uppercase;color:var(--cobalt)}
.c1 .chn{font-family:var(--head);font-size:7.4cqw;line-height:1.05;margin-top:2cqw}
.c1 .rule{width:16cqw;height:.4cqw;background:var(--navy);margin-block:.6cqw}
.c1 .amt{font-family:var(--head);font-size:12cqw;line-height:.9;color:#18743a}
.c1 .to{font-size:3.4cqw;line-height:1.4}
.c1 .to b{font-family:var(--ui);font-weight:700}
.c1 .list{font-family:var(--ui);font-weight:700;font-size:3.4cqw;line-height:1.5}
.c1 .date{position:absolute;right:10cqw;top:9cqw;font-family:var(--ui);font-weight:500;font-size:2.8cqw;color:var(--muted)}
.certs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.yr{background:var(--white);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px}
dialog.cd{width:min(560px,calc(100vw - 32px));max-height:92vh;padding:0;border:3px solid var(--ink);border-radius:22px;box-shadow:10px 10px 0 var(--ink);background:var(--paper);color:var(--navy)}
dialog.cd::backdrop{background:rgba(20,37,79,.62)}
.cd .wrap{padding:24px;display:flex;flex-direction:column;gap:16px}
.cd .ccert{border:3px solid var(--ink);border-radius:6px;overflow:hidden}
.cd .x{align-self:flex-end;background:none;border:none;font-size:30px;cursor:pointer;line-height:1;color:var(--navy)}
.cd .post{font-size:17px;background:var(--white);border:2px solid var(--soft);border-radius:12px;padding:12px 14px;margin:0}
@media (max-width:760px){.certs{grid-template-columns:1fr}}
@media (max-width:760px){.pay{grid-template-columns:1fr}}
</style>
</head><body>
<header id="site-head"></header>
<main class="gut">
  <div class="hello">
    <div><span class="eyebrow">Harbourline Capital</span><h1 class="page">My bookings</h1></div>
    <div class="acts"><a class="btn sm" href="find.html">Find an expert</a><a class="btn ghost sm" href="index.html">Sign out</a></div>
  </div>
  <div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </div>
</main>
<dialog class="cd" id="cdlg" aria-labelledby="cdT"><div class="wrap"><button class="x" type="button" id="cdx" aria-label="Close">×</button><h2 class="sec" id="cdT" style="font-size:28px;margin:0">Certificate of impact</h2><div class="ccert" id="cdc"></div><p class="hint" style="margin:0">Optional. Share it only if you would like to.</p><p class="post" id="cdp"></p><div class="acts"><button class="btn sm" type="button" data-done="Opening LinkedIn">Post on LinkedIn</button><button class="btn ghost sm" type="button" data-done="Saved">Download image</button></div></div></dialog>
<footer id="site-foot"></footer>
<script src="site.js"></script>
<script>
const S={
  requests:[
    {who:'The Hon. Inglebert Montgomery-Smythe',topic:'Scaling seaweed farming in the Scottish Highlands',amt:350,st:'wait',lab:'Waiting for reply',sent:'Sent today'},
    {who:'Aino Väisänen',topic:'Woodland carbon in northern Finland',amt:500,st:'ok',lab:'Accepted',sent:'Sent 20 Oct'},
    {who:'Priya Raman',topic:'Port investment outlook',amt:500,st:'no',lab:'Declined',sent:'Sent 12 Oct',why:'Priya is fully booked this month.'}
  ],
  booked:[{who:'Aino Väisänen',when:'Mon 2 Nov, 09:00 · Video call · 1 hour',contact:'aino@example.fi'}],
  pay:[{id:'p1',who:'The Hon. Inglebert Montgomery-Smythe',what:'Video call, 21 Oct',amt:350,ch:'Loch Broom Lifeboat Fund',ref:'DO-0047',stage:2,due:'Please donate by Fri 23 Oct (48 hours)'}],
  receipts:[['8 Oct 2026','Loch Broom Lifeboat Fund','The Hon. Inglebert Montgomery-Smythe','DO-0042',500,'seaweed farming',true],['24 Sep 2026','Seafarers Support Network','Priya Raman','DO-0035',600,'port investment',false],['3 Sep 2026','Northern Woodland Trust','Aino Väisänen','DO-0029',450,'woodland carbon',true]],
  named:false, rated:0, msg:''
};
const TABS=[['req','Requests'],['book','Booked'],['pay','Donations to make'],['rec','Receipts'],['acc','Account']];
let tab='req';
const $=id=>document.getElementById(id), gbp=n=>'£'+n.toLocaleString('en-GB');
function trk(stage){ return DapperTracker.html(['Pledged','Expert sent it','You paid','Charity received'],stage); }
function tabs(){
  const n={req:S.requests.filter(r=>r.st==='wait').length,pay:S.pay.filter(p=>p.stage===2).length};
  $('tabs').innerHTML=TABS.map(([k,l])=>'<button role="tab" id="tab-'+k+'" aria-selected="'+(k===tab)+'" data-k="'+k+'">'+l+(n[k]?' <span class="badge">'+n[k]+'</span>':'')+'</button>').join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;S.msg='';draw();});
}
function draw(){
  tabs(); let h=S.msg?'<p class="ok-msg">'+S.msg+'</p>':'';
  if(tab==='req'){
    h+='<h2 class="sec" style="font-size:32px">Requests</h2>';
    S.requests.forEach(r=>{h+='<div class="item"><div class="item-h"><div><b>'+r.who+'</b><span class="meta">'+r.topic+' · '+r.sent+'</span></div><span class="pill '+r.st+'">'+r.lab+'</span></div><dl class="dl"><dt>Pledged</dt><dd>'+gbp(r.amt)+'</dd>'+(r.why?'<dt>Reason</dt><dd>'+r.why+'</dd>':'')+'</dl>'+(r.st==='no'?'<div class="acts"><a class="btn ghost sm" href="find.html">Find another expert</a></div>':'')+(r.st==='ok'?'<div class="acts"><button class="btn ghost sm" data-k2="book">See booking</button></div>':'')+'</div>';});
  }
  if(tab==='book'){
    h+='<h2 class="sec" style="font-size:32px">Booked</h2>';
    S.booked.forEach(b=>{h+='<div class="item"><div class="item-h"><div><b>'+b.who+'</b><span class="meta">'+b.when+'</span></div><span class="pill ok">Booked</span></div><dl class="dl"><dt>Contact</dt><dd>'+b.contact+'</dd></dl><div class="acts"><button class="btn sm" type="button" data-done="Opening the call">Join video call</button><button class="btn ghost sm" type="button" data-done="Added to calendar">Add to calendar</button></div></div>';});
  }
  if(tab==='pay'){
    h+='<h2 class="sec" style="font-size:32px">Donations to make</h2><p class="lead" style="margin:0">Donate on the charity\'s own page, quote the reference, then upload your receipt. Dapperowl never touches the money.</p>';
    S.pay.forEach(p=>{
      h+='<div class="item"><div class="item-h"><div><b>'+p.who+'</b><span class="meta">'+p.what+'</span></div><span class="pill '+(p.stage===2?'wait':'ok')+'">'+(p.stage===2?p.due:'Paid')+'</span></div>'+trk(p.stage);
      if(p.stage===2){
        h+='<div class="pay"><div class="box" style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Step 1 · Donate</span><span style="font-size:19px"><b>'+gbp(p.amt)+'</b> to <b>'+p.ch+'</b></span><span>Quote this reference:</span><span class="ref">'+p.ref+'</span><button class="btn sm" type="button" data-done="Opening the charity\'s page">Donate on the charity\'s page ↗</button></div>'+
        '<div class="upload"><span class="eyebrow">Step 2 · Upload your receipt</span><label for="up'+p.id+'" class="lab" style="font-size:17px">Donation confirmation (PDF, image or email)</label><input type="file" id="up'+p.id+'"><button class="btn green sm" data-paid="'+p.id+'">I\'ve donated, send receipt</button></div></div>'+
        '<details><summary class="lab" style="cursor:pointer">Something went wrong? Flag a problem</summary><div class="radios" style="display:flex;flex-direction:column;gap:10px;margin-top:12px"><label class="radio"><input type="radio" name="fl'+p.id+'">The expert didn\'t show up (nothing is owed)</label><label class="radio"><input type="radio" name="fl'+p.id+'">The session was cut short or started late (pay part, with a reason the expert sees)</label><button class="btn ghost sm" type="button" style="align-self:flex-start" data-done="Problem flagged. We\'ll be in touch within a working day">Flag problem</button></div></details>';
      } else h+='<p style="margin:0;font-size:18px">Receipt sent to the expert. We\'ll let you know when '+p.ch+' confirms.</p>';
      h+='</div>';
    });
    h+='<div class="item"><b style="font-family:var(--ui);font-size:20px">How was your conversation with Aino?</b><span class="meta">Private rating, seen only by Dapperowl.</span><div class="stars" id="stars">'+[1,2,3,4,5].map(n=>'<button type="button" aria-label="'+n+' stars" data-r="'+n+'" class="'+(n<=S.rated?'on':'')+'">★</button>').join('')+'</div></div>';
  }
  if(tab==='rec'){
    const tot=S.receipts.reduce((a,r)=>a+r[4],0);
    h+='<h2 class="sec" style="font-size:32px">Receipts</h2><p class="lead" style="margin:0">'+gbp(tot)+' donated to 3 charities through Dapperowl. Use these for your charity reporting.</p><div class="tw"><table><thead><tr><th>Date</th><th>Charity</th><th>Expert</th><th>Reference</th><th>Amount</th><th></th></tr></thead><tbody>'+
      S.receipts.map((r,i)=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td class="num">'+gbp(r[4])+'</td><td><div class="acts" style="flex-wrap:nowrap"><button class="btn ghost sm" type="button" data-done="Downloaded">Receipt</button>'+(r[7]?'<span class="meta">Certificate once the charity confirms</span>':'<button class="btn sm" type="button" data-cert="'+i+'">Certificate</button>')+'</div></td></tr>').join('')+'</tbody></table></div><div class="acts"><button class="btn sm" type="button" id="csv">Export all (CSV)</button></div>'+
      '<div class="yr"><span class="eyebrow">Optional · for LinkedIn or your annual report</span><b style="font-family:var(--ui);font-size:21px">Your 2026 certificate of impact</b><p style="margin:0;font-size:18px">One certificate showing every charity your donations reached this year. Each certificate is made once the charity confirms the donation, and names an expert only if they agree.</p><div class="acts"><button class="btn sm" type="button" data-cert="year">See your 2026 certificate</button></div></div>';
  }
  if(tab==='acc'){
    h+='<h2 class="sec" style="font-size:32px">Account</h2><dl class="dl"><dt>Organisation</dt><dd>Harbourline Capital</dd><dt>Type</dt><dd>Investor or fund</dd><dt>Website</dt><dd>harbourline.example.com (verified)</dd><dt>Team</dt><dd>James Okafor (you) · Mei Chen</dd></dl>'+
      '<label class="switch"><input type="checkbox" id="named" '+(S.named?'checked':'')+'>Name Harbourline Capital on experts\' LinkedIn certificates</label><p class="hint" style="margin:0">Off by default: certificates say "a firm" unless you opt in.</p><div class="acts"><button class="btn ghost sm" type="button" data-done="Invite sent">Invite a colleague</button></div>';
  }
  $('panel').innerHTML=h;
  $('panel').querySelectorAll('[data-k2]').forEach(b=>b.onclick=()=>{tab=b.dataset.k2;draw();});
  $('panel').querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{const p=S.pay.find(x=>x.id===b.dataset.paid);p.stage=3;S.receipts.unshift(['Today',p.ch,p.who,p.ref,p.amt,'',false,true]);S.msg='Thank you. Your receipt has gone to '+p.who.split(' ').slice(-1)[0]+', and we\'ve asked '+p.ch+' to confirm.';draw();});
  const st=$('stars'); if(st) st.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.rated=+b.dataset.r;draw();});
  $('panel').querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>cert(b.dataset.cert));
  const cv=$('csv'); if(cv) cv.onclick=()=>{const rows=[['Date','Charity','Expert','Reference','Amount (GBP)']].concat(S.receipts.map(r=>[r[0],r[1],r[2],r[3],r[4]]));const blob=new Blob([rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dapperowl-donations.csv';a.click();};
  const nm=$('named'); if(nm) nm.onchange=()=>{S.named=nm.checked;};
}
function cert(k){
  const logo=DAPPER_LOGO('#fff','#14254F'); let inner, post;
  if(k==='year'){
    const rs=S.receipts.filter(r=>!r[7]), tot=rs.reduce((a,r)=>a+r[4],0), chs=[...new Set(rs.map(r=>r[1]))];
    inner='<span class="k">Certificate of impact · 2026</span><span class="chn" style="font-size:6cqw">'+chs.length+' charities supported</span><span class="list">'+chs.join('<br>')+'</span><span class="rule"></span><span class="amt">'+gbp(tot)+'</span><span class="to">received from <b>Harbourline Capital</b><br>in return for expert conversations</span>';
    post='This year, '+chs.join(', ').replace(/, ([^,]*)$/,' and $1')+' received '+gbp(tot)+' through our conversations with experts on Dapperowl. Thank you to every expert who gave their time, and to the charities for the work they do.';
  } else {
    const r=S.receipts[+k], ex=r[6]?r[2]:'an industry expert';
    inner='<span class="k">Certificate of impact</span><span class="chn">'+r[1]+'</span><span class="to">received</span><span class="amt">'+gbp(r[4])+'</span><span class="rule"></span><span class="to">from <b>Harbourline Capital</b>, given in return for a conversation on '+r[5]+' with <b>'+ex+'</b></span>';
    post=r[1]+' received '+gbp(r[4])+' after our conversation on '+r[5]+' with '+ex+'. Instead of being paid, the expert asked us to donate to a cause they care about. Thank you to '+r[1]+' for the work they do.';
  }
  $('cdc').innerHTML='<div class="cq"><div class="cert c1"><div class="frame"></div><div class="in">'+logo.replace('class="logo"','class="logo"')+inner+'</div><span class="date">'+(k==='year'?'2026':S.receipts[+k][0].replace(/^\d+ /,''))+'</span></div></div>';
  $('cdp').textContent='Suggested post: “'+post+'”';
  $('cdlg').showModal();
}
$('cdx').onclick=()=>$('cdlg').close();
$('cdlg').addEventListener('click',e=>{if(e.target===$('cdlg'))$('cdlg').close();});
draw();
</script>
</body></html>
